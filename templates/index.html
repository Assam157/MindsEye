  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Mirror – Biofeedback</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0e1a; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 20;
            color: #c8d6e5;
            background: rgba(10, 14, 26, 0.75);
            backdrop-filter: blur(8px);
            padding: 20px 30px;
            border-radius: 20px;
            border-left: 5px solid #4fc3f7;
            min-width: 260px;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #ui h2 {
            margin: 0 0 10px 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: #4fc3f7;
        }
        #ui .stat {
            font-size: 18px;
            margin: 8px 0;
        }
        #ui .stat span {
            font-weight: 600;
            color: #fff;
        }
        #tip {
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(79, 195, 247, 0.15);
            border-radius: 12px;
            font-style: italic;
            color: #b0d4e8;
            border-left: 3px solid #4fc3f7;
            font-size: 16px;
        }
        #stress-ring {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#4fc3f7 0%, #4fc3f7 0%, #1a1e2e 0%);
            z-index: 20;
            box-shadow: 0 0 40px rgba(79, 195, 247, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        #stress-ring .label {
            font-size: 14px;
            font-weight: 300;
            opacity: 0.6;
            margin-top: 4px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }
        .breathing-guide {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #4fc3f7;
            font-size: 14px;
            opacity: 0.7;
            z-index: 20;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui">
        <h2>🧘 Mind Mirror</h2>
        <div class="stat">😌 Stress: <span id="stressDisplay">0</span>%</div>
        <div class="stat">👁️ Blink rate: <span id="blinkDisplay">0.0</span> /s</div>
        <div class="stat">👄 Mouth tension: <span id="mouthDisplay">0.0</span></div>
        <div id="tip">💡 Start by taking a slow breath.</div>
    </div>

    <div id="stress-ring">
        <span id="ringValue">0</span><span style="font-size:18px;">%</span>
        <div class="label">stress</div>
    </div>

    <div class="breathing-guide">
        🌬️ Breathe with the orb
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>

    <script>
        // ----- SOCKET.IO -----
        const socket = io();
        let stress = 0;
        let blinkRate = 0;
        let mouthTension = 0;
        let tip = "";

        socket.on('biofeedback', (data) => {
            stress = data.stress;
            blinkRate = data.blink_rate;
            mouthTension = data.mouth_tension;
            tip = data.tip;

            document.getElementById('stressDisplay').innerText = Math.round(stress);
            document.getElementById('blinkDisplay').innerText = blinkRate.toFixed(1);
            document.getElementById('mouthDisplay').innerText = mouthTension.toFixed(2);
            document.getElementById('tip').innerText = '💡 ' + tip;

            // Update ring (stress meter)
            const ring = document.getElementById('stress-ring');
            const angle = (stress / 100) * 360;
            ring.style.background = `conic-gradient(#4fc3f7 0%, #4fc3f7 ${angle}deg, #1a1e2e ${angle}deg 100%)`;
            document.getElementById('ringValue').innerText = Math.round(stress);
        });

        // ----- THREE.JS SCENE (Calm Environment) -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e1a);

        // Soft fog
        scene.fog = new THREE.FogExp2(0x0a0e1a, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 4.5);
        camera.lookAt(0, 0, -2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        document.body.prepend(renderer.domElement);

        // ----- Lighting -----
        const ambient = new THREE.AmbientLight(0x334466, 0.4);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xaaccff, 0.6);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const backLight = new THREE.PointLight(0x4fc3f7, 0.3);
        backLight.position.set(-1, 1, -5);
        scene.add(backLight);

        // ----- Ground (shimmering grid) -----
        const gridHelper = new THREE.GridHelper(20, 20, 0x4fc3f7, 0x2a3a5a);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        // ----- Floating Particles (stars) -----
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 800;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 40;
            starPos[i+1] = (Math.random() - 0.5) * 20 + 2;
            starPos[i+2] = (Math.random() - 0.5) * 30 - 5;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.06,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ----- The Breathing Orb (main focus) -----
        const orbGroup = new THREE.Group();
        orbGroup.position.set(0, 0.2, -2);

        // Glow sphere
        const orbGeo = new THREE.SphereGeometry(0.8, 64, 64);
        const orbMat = new THREE.MeshStandardMaterial({
            color: 0x4fc3f7,
            emissive: 0x1a3a5a,
            emissiveIntensity: 0.3,
            roughness: 0.2,
            metalness: 0.1,
            transparent: true,
            opacity: 0.85
        });
        const orb = new THREE.Mesh(orbGeo, orbMat);
        orb.castShadow = true;
        orbGroup.add(orb);

        // Inner glow ring
        const ringGeo = new THREE.TorusGeometry(0.9, 0.03, 32, 64);
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x88ddff,
            emissive: 0x4fc3f7,
            emissiveIntensity: 0.5
        });
        const glowRing = new THREE.Mesh(ringGeo, ringMat);
        glowRing.rotation.x = Math.PI / 2;
        glowRing.position.y = 0.1;
        orbGroup.add(glowRing);

        scene.add(orbGroup);

        // Ambient floating particles around orb
        const auraParticles = new THREE.BufferGeometry();
        const auraCount = 120;
        const auraPos = new Float32Array(auraCount * 3);
        for (let i = 0; i < auraCount * 3; i += 3) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 1.0 + Math.random() * 0.8;
            auraPos[i] = r * Math.sin(phi) * Math.cos(theta);
            auraPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
            auraPos[i+2] = r * Math.cos(phi);
        }
        auraParticles.setAttribute('position', new THREE.BufferAttribute(auraPos, 3));
        const auraMat = new THREE.PointsMaterial({
            color: 0x88ddff,
            size: 0.04,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const aura = new THREE.Points(auraParticles, auraMat);
        orbGroup.add(aura);

        // ----- Animation Loop -----
        let clock = new THREE.Clock();
        let orbPhase = 0;

        function animate() {
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // ---- Orb response to stress ----
            // Color: calm (blue) -> stressed (red-orange)
            const hue = 0.55 - (stress / 100) * 0.35; // 0.55 (cyan) -> 0.0 (red)
            const color = new THREE.Color().setHSL(hue, 0.8, 0.5);
            orbMat.color.copy(color);
            orbMat.emissive.setHSL(hue, 0.6, 0.2 + (stress / 100) * 0.3);

            // Size: pulse slowly, but also shrink/grow slightly with stress
            const breathe = Math.sin(elapsed * 0.8) * 0.05 + 1.0;
            const stressScale = 1.0 - (stress / 100) * 0.15; // shrink under stress
            const scale = breathe * stressScale;
            orb.scale.set(scale, scale, scale);

            // Orb rotation (gentle)
            orbGroup.rotation.y += delta * 0.1;

            // Ring rotation
            glowRing.rotation.z += delta * 0.2;

            // Aura particles drift
            const positions = aura.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i], y = positions[i+1], z = positions[i+2];
                const dist = Math.sqrt(x*x + y*y + z*z);
                if (dist > 0.1) {
                    const speed = 0.002;
                    positions[i] += (Math.random() - 0.5) * speed;
                    positions[i+1] += (Math.random() - 0.5) * speed;
                    positions[i+2] += (Math.random() - 0.5) * speed;
                    // keep within bounds
                    const newDist = Math.sqrt(positions[i]*positions[i] + positions[i+1]*positions[i+1] + positions[i+2]*positions[i+2]);
                    if (newDist > 1.8 || newDist < 0.9) {
                        positions[i] = 1.0 + Math.random() * 0.8;
                        positions[i+1] = 1.0 + Math.random() * 0.8;
                        positions[i+2] = 1.0 + Math.random() * 0.8;
                    }
                }
            }
            aura.geometry.attributes.position.needsUpdate = true;

            // Stars gentle drift
            const starPosAttr = stars.geometry.attributes.position;
            const starArray = starPosAttr.array;
            for (let i = 0; i < starArray.length; i += 3) {
                starArray[i+1] += Math.sin(elapsed + i) * 0.0002;
            }
            starPosAttr.needsUpdate = true;

            // Render
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // ----- Resize -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log("🧘 Mind Mirror active – observe your biofeedback.");
    </script>
</body>
</html>
