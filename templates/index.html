 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind's Eye – Biofeedback</title>
    <style>
        /* (keep your existing styles – no changes) */
    </style>
</head>
<body>
    <!-- UI Overlay (same as before) -->
    <div id="ui">
        <h2>🧘 Mind Mirror</h2>
        <div class="stat">😌 Stress: <span id="stressDisplay">0</span>%</div>
        <div class="stat">👁️ Blink rate: <span id="blinkDisplay">0.0</span> /s</div>
        <div class="stat">👄 Mouth tension: <span id="mouthDisplay">0.0</span></div>
        <div id="tip">💡 Start by taking a slow breath.</div>
    </div>
    <div id="stress-ring">
        <span id="ringValue">0</span><span style="font-size:18px;">%</span>
        <div class="label">stress</div>
    </div>
    <!-- Three.js Scene (unchanged) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <!-- MediaPipe Vision Tasks -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/mediapipe_vision_wasm_internal.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/mediapipe_vision_wasm.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/mediapipe_vision.js" crossorigin="anonymous"></script>
    <script type="module">
        // ----- Socket.io -----
        const socket = io();
        let stress = 0;
        // (we'll update these from the detection loop)
        function sendMetrics(data) {
            socket.emit('biofeedback', data);
        }

        // ----- MediaPipe Face Landmarker (Client) -----
        const { FaceLandmarker, FilesetResolver, DrawingUtils } = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );

        const faceLandmarker = await FaceLandmarker.createFromOptions(
            {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
                    delegate: "CPU"   // force CPU, no GPU needed
                },
                runningMode: "VIDEO",
                outputFaceBlendshapes: false,
                outputFacialTransformationMatrixes: false,
                numFaces: 1
            }
        );

        // ----- Webcam Setup -----
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.width = 320;
        video.height = 240;
        document.body.appendChild(video); // hidden, can be visible for debugging

        const startCamera = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });
        };
        await startCamera();

        // ----- Landmark Indices (same as Python) -----
        const LEFT_EYE = [33, 160, 158, 133, 153, 144];
        const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
        const MOUTH = [13, 14, 78, 308];

        function distance(p1, p2) {
            return Math.hypot(p1.x - p2.x, p1.y - p2.y);
        }

        function aspectRatio(landmarks, indices) {
            if (indices.length === 6) {
                const [p1, p2, p3, p4, p5, p6] = indices.map(i => landmarks[i]);
                const vert1 = distance(p2, p6);
                const vert2 = distance(p3, p5);
                const hor = distance(p1, p4);
                return hor === 0 ? 0 : (vert1 + vert2) / (2.0 * hor);
            } else if (indices.length === 4) {
                const [top, bottom, left, right] = indices.map(i => landmarks[i]);
                const vert = distance(top, bottom);
                const hor = distance(left, right);
                return hor === 0 ? 0 : vert / hor;
            }
            return 0;
        }

        // ----- Detection Loop -----
        let lastBlinkTime = performance.now() / 1000;
        let blinkCount = 0;
        let prevNose = null;
        let stressValue = 0;
        let frameCount = 0;
        const emitEvery = 5;

        async function detect() {
            const results = await faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];

                const earLeft = aspectRatio(landmarks, LEFT_EYE);
                const earRight = aspectRatio(landmarks, RIGHT_EYE);
                const ear = (earLeft + earRight) / 2.0;
                const mar = aspectRatio(landmarks, MOUTH);
                const nose = landmarks[1];

                const now = performance.now() / 1000;
                if (ear < 0.2 && (now - lastBlinkTime) > 0.15) {
                    blinkCount++;
                    lastBlinkTime = now;
                }

                let elapsed = now - lastBlinkTime;
                let blinkRate = elapsed > 1 ? blinkCount / elapsed : 0;
                if (elapsed > 5.0) blinkCount = 0;

                let headSpeed = 0;
                if (prevNose && nose) {
                    const dx = Math.abs(nose.x - prevNose.x);
                    const dy = Math.abs(nose.y - prevNose.y);
                    headSpeed = (dx + dy) * 5;
                }
                prevNose = nose;

                const eyeStrain = Math.abs(ear - 0.22) * 2.0;
                const mouthTension = Math.abs(mar - 0.15) * 2.0;
                const blinkFactor = Math.min(1.0, blinkRate * 2.0);
                const headFactor = Math.min(1.0, headSpeed * 0.2);

                const rawStress = (eyeStrain * 25) + (mouthTension * 20) + (blinkFactor * 30) + (headFactor * 25);
                const targetStress = Math.min(100, rawStress);
                stressValue = 0.9 * stressValue + 0.1 * targetStress;

                let tip = "You seem calm – keep breathing steadily.";
                if (stressValue > 80) tip = "Take a break – step away from the screen for a minute.";
                else if (stressValue > 60) tip = "Close your eyes for a moment and focus on your breath.";
                else if (stressValue > 40) tip = "Try a slow, deep breath – in for 4, out for 6.";
                else if (stressValue > 20) tip = "Notice any tension? Roll your shoulders gently.";

                // Update UI
                document.getElementById('stressDisplay').innerText = Math.round(stressValue);
                document.getElementById('blinkDisplay').innerText = blinkRate.toFixed(1);
                document.getElementById('mouthDisplay').innerText = mouthTension.toFixed(2);
                document.getElementById('tip').innerText = '💡 ' + tip;
                const ring = document.getElementById('stress-ring');
                const angle = (stressValue / 100) * 360;
                ring.style.background = `conic-gradient(#4fc3f7 0%, #4fc3f7 ${angle}deg, #1a1e2e ${angle}deg 100%)`;
                document.getElementById('ringValue').innerText = Math.round(stressValue);

                // Send to server every N frames
                frameCount++;
                if (frameCount % emitEvery === 0) {
                    socket.emit('biofeedback', {
                        stress: Math.round(stressValue * 10) / 10,
                        blink_rate: parseFloat(blinkRate.toFixed(2)),
                        mouth_tension: parseFloat(mouthTension.toFixed(2)),
                        tip: tip
                    });
                }
            }

            requestAnimationFrame(detect);
        }
        detect();

        // ----- Three.js Scene (unchanged from your existing code) -----
        // (Paste your Three.js code here – the one with the breathing orb)
        // It will listen to the same 'biofeedback' events as before.

        console.log("🧘 Mind's Eye – client side active.");
    </script>
</body>
</html>
